<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#B71C1C">
<title>LabGuru - MLS Learning Companion</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--blood:#B71C1C;--white:#FFFFFF;--lightgray:#F5F5F5;--text:#212121;--bg:#FFFFFF;--font:16px}
[data-theme="dark"]{--bg:#121212;--text:#E0E0E0;--lightgray:#1E1E1E}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Roboto',Arial,sans-serif}
body{background:var(--bg);color:var(--text);font-size:var(--font)}
header{background:var(--blood);color:var(--white);padding:12px 16px;display:flex;justify-content:space-between;position:sticky;top:0}
.btn{background:var(--blood);color:var(--white);padding:12px 20px;border:none;border-radius:8px;font-weight:600;cursor:pointer;width:100%;margin-top:10px}
.card{background:var(--lightgray);margin:10px;border-radius:12px;padding:16px;cursor:pointer}
.search{width:96%;margin:10px;padding:12px;border-radius:8px;border:1px solid #ccc}
.menu{position:fixed;left:-280px;top:0;width:280px;height:100%;background:var(--bg);transition:0.3s;z-index:200;padding:20px;box-shadow:2px 0 10px rgba(0,0,0,0.2)}
.menu.active{left:0}
.analysis{padding:16px} .analysis h2{color:var(--blood)} .analysis h3{margin-top:16px;color:var(--blood)}
.premium{text-align:center;padding:40px 20px} .hidden{display:none}
mark{background:yellow}
</style>
</head>
<body>
<header>
  <button onclick="toggleMenu()">☰</button>
  <h1>LabGuru</h1>
  <button onclick="toggleTheme()">🌙</button>
</header>

<div class="menu" id="menu">
  <h3>LabGuru</h3><p><small>MLS Learning Companion</small></p><hr>
  <p onclick="showHome()">Home</p><p onclick="showUnits()">Course Outline</p><p onclick="showSearch()">Search</p>
  <p onclick="showQA()">Q & A</p><p onclick="showConverter()">Unit Converter</p><p onclick="showPremium()">Premium</p>
  <p onclick="showFAQs()">FAQs</p><hr>
  <label>Font: <select onchange="setFont(this.value)"><option>14px</option><option selected>16px</option><option>18px</option></select></label>
</div>

<main id="app"></main>

<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="data.js"></script>
<script>
let readCount = +localStorage.getItem('readCount')||0;
let isPremium = localStorage.getItem('isPremium')==='true';

function toggleMenu(){document.getElementById('menu').classList.toggle('active')}
function toggleTheme(){document.documentElement.setAttribute('data-theme',document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')}
function setFont(s){document.documentElement.style.setProperty('--font',s);localStorage.setItem('font',s)}

function showHome(){
  toggleMenu();
  document.getElementById('app').innerHTML = `
  <div style="text-align:center;padding:20px">
    <div style="font-size:4rem">🧪</div><h2>LabGuru</h2><p><i>Medical Laboratory Science Learning Companion</i></p>
    <div class="card"><h3>What is MLS?</h3><p>Medical Laboratory Science is the study of laboratory analysis of body fluids, tissues and cells to aid in diagnosis, treatment and prevention of disease. This app teaches you principles, procedures and interpretation in simple steps for students and exam prep.</p></div>
    <button class="btn" onclick="showUnits()">Start Learning</button>
  </div>`;
}

function showUnits(){
  toggleMenu();
  let html = `<input class="search" placeholder="Search analyses..." onkeyup="search(this.value)"><h2 style="padding:12px">MLS Units</h2>`;
  LAB_DATA.units.forEach(u=>{html+=`<div class="card" onclick="openUnit('${u.id}')"><h3>${u.name}</h3><p>${u.analyses.length} Analyses</p></div>`});
  document.getElementById('app').innerHTML = html;
}

function openUnit(id){
  const u = LAB_DATA.units.find(x=>x.id===id);
  let html=`<h2 style="padding:12px">${u.name}</h2>`;
  u.analyses.forEach(a=>{html+=`<div class="card" onclick="openAnalysis('${id}','${a.id}')">${a.title}</div>`});
  document.getElementById('app').innerHTML=html;
}

function openAnalysis(uid, aid){
  if(!isPremium && readCount>=5){showPremium();return;}
  const a = LAB_DATA.units.find(u=>u.id===uid).analyses.find(x=>x.id===aid);
  if(!isPremium){readCount++;localStorage.setItem('readCount',readCount)}
  document.getElementById('app').innerHTML=`
  <div class="analysis">
    <button onclick="showUnits()">← Back</button>
    <h2>${a.title}</h2>
    <h3>1. Introduction</h3><p>${a.intro}</p>
    <h3>2. Aim</h3><p>${a.aim}</p>
    <h3>3. Principles</h3><p>${a.principles}</p>
    <h3>4. Materials Needed</h3><ul>${a.materials.map(m=>`<li>${m}</li>`).join('')}</ul>
    <h3>5. Procedure</h3><ul>${a.procedure.map(p=>`<li>${p}</li>`).join('')}</ul>
    <h3>6. Possible Result</h3><p>${a.result}</p>
    <h3>7. Normal Ranges</h3><p>${a.normal}</p>
    <h3>8. Safety Precautions</h3><ul>${a.safety.map(s=>`<li>${s}</li>`).join('')}</ul>
    <h3>9. Exam Tips</h3><p>${a.tips}</p>
  </div>`;
}

function showPremium(){
  toggleMenu();
  document.getElementById('app').innerHTML=`
  <div class="premium">
    <h2>🔒 Unlock LabGuru Premium</h2>
    <p>Access: Unlimited analyses, Unit Converter, Future updates</p><h3>₦2,200 One-time</h3>
    <button class="btn" onclick="pay()">Unlock Premium</button>
  </div>`;
}

async function pay(){
  let email = prompt("Enter your email for receipt");
  let handler = PaystackPop.setup({
    key: LAB_DATA.settings.paystackPublicKey,
    email: email,
    amount: 220000,
    callback: async function(res){
      // Verify with backend
      let verify = await fetch('/api/verify-payment',{method:'POST',body:JSON.stringify({reference:res.reference})});
      let data = await verify.json();
      if(data.status){isPremium=true;localStorage.setItem('isPremium',true);alert('Premium Activated');showUnits()}
      else alert('Verification failed')
    },
    onClose:()=>{}
  });
  handler.openIframe();
}

function showConverter(){if(!isPremium){showPremium();return} toggleMenu(); /* converter UI here */ }
function showQA(){toggleMenu();let html=`<h2 style="padding:12px">Q & A</h2>`;LAB_DATA.questions.forEach((q,i)=>{html+=`<div class="card"><b>Q${i+1}: ${q.q}</b><details><summary>Answer</summary><p>${q.a}</p><p><i>${q.exp}</i></p></details></div>`});document.getElementById('app').innerHTML=html}
function showFAQs(){toggleMenu();let html=`<h2 style="padding:12px">FAQs</h2>`;LAB_DATA.faqs.forEach(f=>{html+=`<div class="card"><b>${f.q}</b><p>${f.a}</p></div>`});document.getElementById('app').innerHTML=html}
function search(q){/* search logic */}

// Init
document.documentElement.style.setProperty('--font',localStorage.getItem('font')||'16px');
showHome();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
